name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: AI-PM Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          check-latest: true
      - name: Install Python dependencies
        run: uv sync
      - name: Cache Node.js dependencies
        uses: actions/cache@v5
        id: cache-node
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-node-
      - name: Install Node.js dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: yarn --frozen-lockfile --production
      - name: Page Build
        run: |
          ./scripts/pre-build/pre-build.sh
          uv run mkdocs build -v
      - name: Post-process HTML
        # https://github.com/TypeStrong/ts-node/issues/1997
        run: node --loader ts-node/esm scripts/post-build/html-postprocess.ts math external-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=3072
      - name: Minify html
        run: ./scripts/post-build/minify-html/minify-html.sh
      - name: Check links
        uses: wjdp/htmltest-action@master
        with:
          skip_external: true
      - name: Deploy to gh-pages
        if: ${{ github.event_name == 'push' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
