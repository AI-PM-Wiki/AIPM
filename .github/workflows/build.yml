name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AI-PM Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          check-latest: true
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Check nav vs docs consistency
        run: uv run python scripts/check-nav.py
      - name: Cache Node.js dependencies
        uses: actions/cache@v5
        id: cache-node
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-node-
      - name: Install Node.js dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: yarn --frozen-lockfile --production
      - name: Check whitespace errors
        run: git diff --check "$(git merge-base origin/main HEAD)"
      - name: Page Build
        run: |
          ./scripts/pre-build/pre-build.sh
          uv run mkdocs build -v
      - name: Post-process HTML
        # https://github.com/TypeStrong/ts-node/issues/1997
        run: node --loader ts-node/esm scripts/post-build/html-postprocess.ts external-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=3072
      - name: Minify html
        run: ./scripts/post-build/minify-html/minify-html.sh
      - name: Check links
        uses: wjdp/htmltest-action@31be84a95c860a331e0cf9a99f71e3eb39d2f86b
        with:
          skip_external: true
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./site
          if-no-files-found: error

  deploy:
    name: Deploy to gh-pages
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # 仅部署 job 需要写权限;构建 job 一律 contents: read
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ./site
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
