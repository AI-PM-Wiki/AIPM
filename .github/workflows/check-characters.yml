name: Check Characters

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check Characters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Get Changed Files
        id: changed-files
        # tj-actions/changed-files 曾有供应链投毒史(CVE-2025-30066),
        # 改用无此历史的 dorny/paths-filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            docs:
              - 'docs/**/*.md'
              - 'docs/**/*.tex'
      - name: Setup Python
        if: steps.changed-files.outputs.docs == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check Changed Files
        if: steps.changed-files.outputs.docs == 'true'
        run: python scripts/check-characters.py
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.docs_files }}
