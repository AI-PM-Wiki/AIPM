name: Check Upstream Remnants

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check Upstream Remnants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Check Remnants
        run: bash scripts/check-upstream-remnants.sh --full
