<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>页面批注</title>

    <!-- 首帧定色：优先取宿主页传来的 scheme，没有就跟随系统偏好。
         这一步必须在样式表之前跑，否则暗色下会先闪一下亮色面板。
         宿主页后续还会把 scheme 与站点 token 直接写进来（见 hypothesis.js），
         用户手动切换亮/暗时同样走那条路径。 -->
    <script>
      (function () {
        var scheme = new URLSearchParams(window.location.search).get("scheme");
        var dark = scheme
          ? scheme === "slate"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-md-color-scheme",
          dark ? "slate" : "default"
        );
      })();
    </script>

    <!-- 站点风格：把客户端的设计 token 映射到站点 token（含暗色），
         不含任何上游代码，随仓库一起版本管理。 -->
    <link rel="stylesheet" href="./theme.css" />
  </head>

  <body>
    <!-- 客户端 app shell：由官方 boot 脚本挂载真正的侧栏应用 -->
    <hypothesis-app></hypothesis-app>

    <!-- 应用配置。取值与官方 https://hypothes.is/app.html 一致：
         批注数据、登录、存储仍全部走 hypothes.is，本站只换了外壳与样式。 -->
    <script class="js-hypothesis-config" type="application/json">
      {"apiUrl": "https://hypothes.is/api/", "authDomain": "hypothes.is", "oauthClientId": "631206c8-7792-11e7-90b3-872e79925778", "rpcAllowedOrigins": ["https://lms.hypothes.is", "https://lms.ca.hypothes.is", "https://lms-dummy.hypothes.is"]}
    </script>

    <!-- 官方客户端 boot（BSD-2，直接引用官方 CDN，不落盘、不 fork） -->
    <script src="https://cdn.hypothes.is/hypothesis"></script>
  </body>
</html>
