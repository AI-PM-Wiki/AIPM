# Theme
theme:
  name: null
  custom_dir: 'mkdocs-material/material/templates'
  static_templates:
    - 404.html
  language: 'zh'
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  favicon: 'favicon.svg'
  logo: 'favicon.svg'
  icon:
    repo: fontawesome/brands/github-alt
  features:
    - content.action.edit
    - navigation.tabs
    - navigation.instant
    - content.code.copy
  font:
    text: 'Noto Sans'
    code: 'JetBrains Mono'

plugins:
- search:
    lang: zh
    separator: '[\s\-]'
- toggle-sidebar:
    theme: material
    toggle_button: all

# TODO(theme-swap): hooks/on_env.py 提供 nav_math 过滤器,仅旧版主题模板需要;
# 主题子模块切换到官方 material 后可将本段与 hooks/on_env.py 一并删除。
hooks:
  - hooks/on_env.py
  - hooks/chat_agent.py

# Customization
extra:
  # disqus: 'your-disqus-shortname'  # TODO: 需要评论区时填写
  copyright: '<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.zh">CC BY-SA 4.0</a> 和 <a href="https://github.com/zTrix/sata-license">SATA</a>'
  manifest: 'manifest.webmanifest'
  # 文档问答 Agent 前端 widget(注入由 hooks/chat_agent.py 完成):
  # enabled 关闭后不再注入;version 缓存击穿号,改了资源后 +1 即可
  chat_agent:
    enabled: true
    version: 10
  # analytics:  # TODO: 需要访问统计时取消注释并填写自己的 ID
  #   # 大陆站点勿用 Google Analytics(GA 在大陆不可直连),建议自建 umami。
  #   provider: umami
  #   property: <data-domain>          # umami 站点 data-domain(如 aipm.ac)
  #   website_id: <umami website_id>   # 自建 umami 实例的 website id(自托管时填写)
  # SEO 优化(2026-08-27):以下占位由用户/ws-build 填写
  seo_home_title: 'AI-PM · AI 产品经理知识库'   # 首页 <title>(base.html 消费)
  og_image: 'social-card.png'                  # 站点级 og:image(base.html 消费;ws-social 产出)
  seo_verification:                            # 站长平台验证码,空串不输出 meta
    google: ''      # 填入 Google Search Console 验证码
    bing: ''        # 填入 Bing Webmaster 验证码(msvalidate.01)
    baidu: ''       # 填入百度搜索资源平台验证码

extra_javascript:
  - '_static/js/mathjax.js?v=2'
  - 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js'
  - '_static/js/banner.js?v=10'
  - '_static/js/header-line.js?v=1'
  - '_static/js/umami.js?v=1'
extra_css:
  - '_static/css/extra.css?v=33'

# Extensions
markdown_extensions:
  - document-offsets-injection:
      # debug: true
  - admonition
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: ""
      slugify: !!python/name:pymdownx.slugs.uslugify
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
