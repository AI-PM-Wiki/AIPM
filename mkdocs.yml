# Theme
theme:
  name: null
  custom_dir: 'mkdocs-material/material/templates'
  static_templates:
    - 404.html
  language: 'zh'
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  favicon: 'favicon.svg'
  logo: 'favicon.svg'
  icon:
    repo: fontawesome/brands/github-alt
  features:
    - content.action.edit
    - navigation.tabs
    - navigation.instant
    - content.code.copy
  font:
    text: 'Noto Sans'
    code: 'JetBrains Mono'

plugins:
- search:
    lang: zh
    separator: '[\s\-]'
- toggle-sidebar:
    theme: material
    toggle_button: all

# TODO(theme-swap): hooks/on_env.py 提供 nav_math 过滤器,仅旧版主题模板需要;
# 主题子模块切换到官方 material 后可将本段与 hooks/on_env.py 一并删除。
hooks:
  - hooks/on_env.py
  - hooks/chat_agent.py

# Customization
extra:
  # disqus: 'your-disqus-shortname'  # TODO: 需要评论区时填写
  copyright: '<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.zh">CC BY-SA 4.0</a> 和 <a href="https://github.com/zTrix/sata-license">SATA</a>'
  manifest: 'manifest.webmanifest'
  # 文档问答 Agent 前端 widget(注入由 hooks/chat_agent.py 完成):
  # enabled 关闭后不再注入;version 缓存击穿号,改了资源后 +1 即可
  chat_agent:
    enabled: true
    version: 10
  # analytics:  # TODO: 需要访问统计时取消注释并填写自己的 ID
  #   provider: google
  #   property: YOUR-GA-ID

extra_javascript:
  - '_static/js/banner.js?v=9'
  - '_static/js/header-line.js?v=1'
extra_css:
  - '_static/css/extra.css?v=31'

# Extensions
markdown_extensions:
  - document-offsets-injection:
      # debug: true
  - admonition
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: ""
      slugify: !!python/name:pymdownx.slugs.uslugify
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
