# Theme
theme:
  name: null
  custom_dir: 'mkdocs-material/material/templates'
  static_templates:
    - 404.html
  language: 'zh'
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  favicon: 'favicon.svg'
  logo: 'favicon.svg'
  icon:
    repo: fontawesome/brands/github-alt
  features:
    - content.action.edit
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.prune
    - content.code.copy
  font:
    text: 'Noto Sans'
    code: 'JetBrains Mono'

plugins:
- search:
    lang: zh
    separator: '[\\s\\-]'
- toggle-sidebar:
    theme: material
    toggle_button: all

hooks:
  - hooks/on_env.py
  - hooks/book_footnotes.py
  - hooks/chat_agent.py
  - hooks/annotation.py
  - hooks/annotation_integrity.py

extra:
  copyright: '<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.zh">CC BY-SA 4.0</a> 和 <a href="https://github.com/zTrix/sata-license">SATA</a>'
  manifest: 'manifest.webmanifest'
  chat_agent:
    enabled: true
    version: 46
  annotation:
    enabled: true
    version: 46
  seo_home_title: 'AI-PM · 产品经理'
  og_image: 'social-card.png'
  seo_verification:
    google: ''
    bing: ''
    baidu: ''

extra_javascript:
  - '_static/js/mathjax.js?v=2'
  - 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js'
  - '_static/js/header-line.js?v=1'
  - '_static/js/umami.js?v=1'
  - '_static/js/mermaid-zoom.js?v=6'
  - '_static/js/book-figures.js'
  - '_static/js/book-footnotes.js'
  - '_static/js/context-item.js?v=3'
  - '_static/js/vendor/svg-xml.js'
  - '_static/js/chart-context.js?v=5'
  - '_static/js/panel-shared.js?v=1'
extra_css:
  - '_static/css/panel-shared.css'
  - '_static/css/extra.css?v=43'
  - '_static/css/mermaid-zoom.css?v=8'
  - '_static/css/book-figures.css'
  - '_static/css/book-footnotes.css'
  - '_static/css/chart-context.css?v=1'
  - '_static/css/annotation-login-consent.css?v=1'

markdown_extensions:
  - document-offsets-injection:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: ""
      slugify: !!python/name:pymdownx.slugs.uslugify
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.smartsymbols:
      fractions: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
