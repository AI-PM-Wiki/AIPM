[project]
name = "ai-pm-wiki"
version = "1.0.0"
description = "AI-PM - AI Product Manager Knowledge Base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mkdocs==1.6.1",
    "pymdown-extensions==11.0.2",
    "pygments",
    "beautifulsoup4",
    "markdown==3.9",
    "python-markdown-document-offsets-injection-extension==0.5.16",
    "mkdocs-toggle-sidebar-plugin==0.0.8",
    "jieba==0.42.1",
]

[dependency-groups]
dev = [
]
# 浏览器用例(test/browser/)要的那一份。单独一组,不进 `uv sync` 的默认安装:
# 默认门禁是零浏览器依赖的,只有跑那几个用例时才需要 `uv sync --group browser`。
browser = [
    "playwright==1.61.0",
]

[tool.uv.pip]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://pypi.tuna.tsinghua.edu.cn/simple"]
